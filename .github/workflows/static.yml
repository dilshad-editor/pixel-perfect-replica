name: Build and Deploy to Branch

on:
  push:
    branches:
      - main # Change to master if your default branch is called master

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Application
        run: |
          npm run build
          cp .output/public/index.html .output/public/404.html

      - name: Deploy Static Files to gh-pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .output/public # Targets the correct Nitro public distribution directory
          branch: gh-pages
          clean: true
