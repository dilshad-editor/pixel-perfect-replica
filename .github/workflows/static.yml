name: Build and Deploy to Branch

on:
  push:
    branches:
      - main # Change to master if your default branch is called master

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Application
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: Deploy Static Files to gh-pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # The folder Vite generated containing your static HTML/CSS
          branch: gh-pages # The target branch where static code will be pushed
          clean: true # Automatically remove old files from the branch
