
name: Deploy Lovable Site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: 🔄 Update npm
        run: |
          npm install --global npm@11.19.1
          npm --version

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🛠 Build Lovable website
        run: npm run build -- --base=/pixel-perfect-replica/

      - name: 🔍 Verify built website
        run: |
          echo "Generated files:"
          ls -la .output/public
          test -f .output/public/index.html || {
            echo "ERROR: index.html missing. Static prerendering must be configured."
            exit 1
          }

      - name: 📄 Generate 404 fallback
        run: cp .output/public/index.html .output/public/404.html

      - name: 🚀 Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .output/public
          clean: true
